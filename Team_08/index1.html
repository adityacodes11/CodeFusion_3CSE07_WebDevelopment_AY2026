        <p><b>TEAM 08</b></p>
        <h1>CSS Selectors</h1>
        <p>Selectors choose HTML elements for styling.</p>
        <h2>Contextual Selectors</h2>
        <p>Descendant: <b>div p</b></p>
        <p>Child: <b>div &gt; p</b></p>
        <p>Adjacent: <b>div + p</b></p>
        <p>General sibling: <b>div ~ p</b></p>
